<script>
  // ═══════════════════════════════════════
  // CONFIGURACIÓN - REEMPLAZA ESTO
  // ═══════════════════════════════════════
  const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzF5dKF-E7VQbKTMawiOK9ixzAbTsUNqqEVDb1iVszelTqE8cUrlR2RP6zcS0L1iVDF/exec'; // <-- Pega aquí tu URL de Apps Script
  const DEMO_MODE = false;       // <-- Cambia a false cuando conectes Sheets

  // ═══════════════════════════════════════
  // DATOS DEMO (misma estructura que Sheets)
  // ═══════════════════════════════════════
  // demoData eliminado - solo Google Sheets


  const categoryIcons = {
    // Formato: { img: 'https://url.jpg', emoji: '🍸' }
    // Si no tienes foto, deja img vacío: ''
    'Cócteles': { img: 'https://i.imgur.com/4mLbMN8.png', emoji: '🍸' },
    'Licores & Tragos': { img: 'https://i.imgur.com/gTtTD1W.png', emoji: '🥃' },
    'Cervezas': { img: '', emoji: '🍺' },
    'Piqueos': { img: 'https://i.imgur.com/rgKyJw9.png', emoji: '🍽️' },
    'Sin Alcohol': { img: '', emoji: '🥤' },
    'Especiales': { img: 'https://i.imgur.com/M3PaIH8.png', emoji: '⭐' }
  };

  const categoryDescriptions = {
    'Cócteles': 'Clásicos y de autor',
    'Licores & Tragos': 'Destilados premium',
    'Cervezas': 'Nacionales e importadas',
    'Piqueos': 'Para compartir',
    'Sin Alcohol': 'Refrescos y mocktails',
    'Especiales': 'De la casa'
  };

  const categoryFooters = {
    'Cócteles': 'Nuestros cócteles pueden variar según disponibilidad de ingredientes.',
    'Licores & Tragos': 'Pregunta por nuestras botellas premium.',
    'Cervezas': 'Siempre bien frías.',
    'Piqueos': 'Perfectos para compartir.',
    'Sin Alcohol': '¡Pregúntanos por más opciones!',
    'Especiales': 'Edición limitada, pregunta al mesero.'
  };

  let menuData = [];
  let showAvailableOnly = false;
  let currentCategory = '';

  // ═══════════════════════════════════════
  // FUNCIONES
  // ═══════════════════════════════════════
  async function loadMenu() {
    const loader = document.getElementById('loading');
    const CACHE_KEY = 'seven_menu_cache';

    // 1. Mostrar cache INSTANTÁNEAMENTE si existe
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        menuData = JSON.parse(cached);
        renderCategories();
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 150);
      } catch (e) {
        localStorage.removeItem(CACHE_KEY);
      }
    }

    // 2. Si no hay URL configurada, mostrar error
    if (!GOOGLE_SHEETS_URL || DEMO_MODE) {
      if (!cached) {
        loader.innerHTML = '<p style="color:#f87171;font-size:13px;">Configuración pendiente</p>';
      }
      return;
    }

    // 3. Actualizar desde Google Sheets en background
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      const response = await fetch(GOOGLE_SHEETS_URL, { signal: controller.signal });
      clearTimeout(timeoutId);

      const freshData = await response.json();

      // Solo actualizar si cambió algo
      if (JSON.stringify(freshData) !== JSON.stringify(menuData)) {
        menuData = freshData;
        localStorage.setItem(CACHE_KEY, JSON.stringify(menuData));
        renderCategories();
      }
    } catch (e) {
      console.error('Error Sheets:', e);
      if (!cached) {
        loader.innerHTML = '<p style="color:#f87171;font-size:13px;">No se pudo cargar el menú</p>';
      }
    }
  }

  function renderCategories() {
    const container = document.getElementById('category-list');
    const categories = [...new Set(menuData.map(item => item.categoria))];

    container.innerHTML = categories.map(cat => {
      const items = menuData.filter(i => i.categoria === cat);
      const available = items.filter(i => i.disponible).length;
      const total = items.length;
      const iconData = categoryIcons[cat] || { img: '', emoji: '📋' };
      const hasImg = iconData.img && iconData.img.startsWith('http');
      const iconHtml = hasImg
        ? '<img src="' + iconData.img + '" onerror="onCatImgError(this)" data-emoji="' + iconData.emoji + '" style="width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;" alt="' + cat + '"><span style="display:none;font-size:24px;">' + iconData.emoji + '</span>'
        : '<span style="font-size:24px;">' + iconData.emoji + '</span>';

      return `
        <div class="category-card" onclick="showCategory('${cat}')">
          <div style="display: flex; align-items: center; gap: 14px;">
            ${iconHtml}
            <div>
              <p class="font-display" style="font-size: 18px; color: #d4af37; margin: 0; font-weight: 400; letter-spacing: 1px;">${cat}</p>
              <p style="font-size: 13px; color: rgba(245,240,230,0.7); margin: 4px 0 0; font-weight: 300; letter-spacing: 0.3px;">${categoryDescriptions[cat] || ''}</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 12px; color: rgba(245,240,230,0.3); font-weight: 400; font-family: 'Playfair Display', serif; letter-spacing: 1px;">${available}/${total}</span>
            <span style="color: #d4af37; font-size: 20px; font-weight: 300;">›</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function showCategory(category) {
    currentCategory = category;
    document.getElementById('category-title').textContent = category;
    document.getElementById('category-footer').textContent = categoryFooters[category] || '';

    const container = document.getElementById('product-list');
    let items = menuData.filter(i => i.categoria === category);

    if (showAvailableOnly) {
      items = items.filter(i => i.disponible);
    }

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">😔</div>
          <p style="font-size: 14px;">No hay productos disponibles en esta categoría.</p>
          <p style="font-size: 12px; margin-top: 8px; color: rgba(245,240,230,0.25);">Intenta desactivar el filtro de disponibilidad.</p>
        </div>
      `;
    } else {
      container.innerHTML = items.map((item, idx) => {
        const isUrl = item.imagen && item.imagen.startsWith('http');
        const imgContent = isUrl
          ? `<img src="${item.imagen}" alt="${item.nombre}" loading="lazy">`
          : `<span>${item.imagen || '🍽️'}</span>`;

        return `
        <div class="product-card" style="animation-delay: ${idx * 0.06}s;">
          <div style="display: flex; gap: 14px; padding: 14px; border: 1px solid rgba(212,175,55,0.1); border-radius: 12px; background: rgba(255,255,255,0.015);">
            <div class="product-img" onclick="openModal('${item.imagen || ''}', '${item.nombre.replace(/'/g, "\'")}')" style="cursor: pointer;">${imgContent}</div>
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
                <h4 style="font-size: 16px; color: #f5f0e6; margin: 0; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3;">${item.nombre}</h4>
                <span style="font-size: 17px; color: #d4af37; font-weight: 600; white-space: nowrap; font-family: 'Inter', sans-serif;">${item.precio > 0 ? '$' + item.precio : 'Consultar'}</span>
              </div>
              ${item.descripcion ? `<p style="font-size: 14px; color: rgba(245,240,230,0.5); margin: 6px 0 0; line-height: 1.45;">${item.descripcion}</p>` : ''}
              <div style="margin-top: 10px;">
                <span class="badge ${item.disponible ? 'available' : 'unavailable'}">
                  <span class="badge-dot"></span>
                  ${item.disponible ? 'Disponible' : 'No Disponible'}
                </span>
              </div>
            </div>
          </div>
        </div>
      `;}).join('');
    }

    showScreen('screen-products');
  }

  function toggleShowAvailableOnly() {
    showAvailableOnly = !showAvailableOnly;
    const indicator = document.getElementById('avail-toggle-indicator');
    indicator.style.background = showAvailableOnly ? '#f87171' : '#4ade80';
    indicator.style.boxShadow = showAvailableOnly ? '0 0 8px rgba(248,113,113,0.4)' : '0 0 8px rgba(74,222,128,0.4)';

    if (currentCategory && document.getElementById('screen-products').classList.contains('active')) {
      showCategory(currentCategory);
    }
  }


  // ===== MODAL FUNCTIONS =====
  function openModal(imagen, nombre) {
    const modal = document.getElementById('product-modal');
    const body = document.getElementById('modal-body');
    const title = document.getElementById('modal-title');
    const isUrl = imagen && imagen.startsWith('http');

    if (isUrl) {
      body.innerHTML = `<img src="${imagen}" alt="${nombre}">`;
    } else {
      body.innerHTML = `
        <div class="modal-no-photo">
          <span>${imagen || '🍽️'}</span>
          <p>No hay foto disponible</p>
        </div>
      `;
    }
    title.textContent = nombre;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    const modal = document.getElementById('product-modal');
    modal.classList.remove('active');
    document.body.style.overflow = '';
  }

  // ===== MODAL =====
  function openModal(imagen, nombre) {
    const modal = document.getElementById('product-modal');
    const body = document.getElementById('modal-body');
    const title = document.getElementById('modal-title');
    imagen = imagen || '';
    nombre = nombre || 'Producto';
    const isUrl = imagen.startsWith('http');

    if (isUrl) {
      body.innerHTML = '<img src="' + imagen + '" alt="' + nombre.replace(/"/g, '&quot;') + '">';
    } else {
      body.innerHTML = '<div class="modal-no-photo"><span>' + (imagen || '🍽️') + '</span><p>No hay foto disponible</p></div>';
    }
    title.textContent = nombre;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('product-modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  // ===== CATEGORY ICON FALLBACK =====
  function onCatImgError(img) {
    img.style.display = 'none';
    img.nextElementSibling.style.display = 'inline';
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ═══════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════
  loadMenu();
</script>
</body>
</html>
