      color: #e8dcc8;

      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: #0a0a0a;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);

    .screen { display: none; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }

    .product-card { animation: slideUp 0.35s ease both; }

      color: #d4af37;

      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;

      font-weight: 500;
      transition: all 0.3s ease;

    .btn-gold:hover { background: rgba(212,175,55,0.12); }
    .category-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 12px;
      cursor: pointer;
      background: rgba(212,175,55,0.03);
      transition: all 0.25s ease;
    }
    .category-card:hover { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.35); transform: translateY(-1px); }
    .product-img {

      height: 76px;
      border-radius: 10px;
      background: rgba(212,175,55,0.07);

      align-items: center;
      justify-content: center;

      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;

  // ═══════════════════════════════════════
  // FUNCIONES
  // ═══════════════════════════════════════
  async function loadMenu() {
    const loader = document.getElementById('loading');
    loader.style.opacity = '1';
    loader.style.display = 'flex';

    if (DEMO_MODE || !GOOGLE_SHEETS_URL) {
      await new Promise(r => setTimeout(r, 900));
      menuData = [...demoData];
    } else {
      try {
        const response = await fetch(GOOGLE_SHEETS_URL);
        menuData = await response.json();
      } catch (e) {
        console.error('Error cargando Google Sheets:', e);
        menuData = [...demoData];
      }
    }

    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 400);
    renderCategories();
  }

    const container = document.getElementById('category-list');
    const categories = [...new Set(menuData.map(item => item.categoria))];

    container.innerHTML = categories.map(cat => {

      const available = items.filter(i => i.disponible).length;
      const total = items.length;
      return `
        <div class="category-card" onclick="showCategory('${cat}')">
          <div style="display: flex; align-items: center; gap: 14px;">
            <span style="font-size: 24px;">${categoryIcons[cat] || '📋'}</span>
            <div>

          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 11px; color: rgba(245,240,230,0.35); font-weight: 500;">${available}/${total}</span>
            <span style="color: #d4af37; font-size: 20px; font-weight: 300;">›</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function showCategory(category) {
    currentCategory = category;
    document.getElementById('category-title').textContent = category;
    document.getElementById('category-footer').textContent = categoryFooters[category] || '';

    const container = document.getElementById('product-list');
    let items = menuData.filter(i => i.categoria === category);

    if (showAvailableOnly) {
      items = items.filter(i => i.disponible);
    }

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">😔</div>
          <p style="font-size: 14px;">No hay productos disponibles en esta categoría.</p>
          <p style="font-size: 12px; margin-top: 8px; color: rgba(245,240,230,0.25);">Intenta desactivar el filtro de disponibilidad.</p>
        </div>
      `;
    } else {
      container.innerHTML = items.map((item, idx) => {
        const isUrl = item.imagen && item.imagen.startsWith('http');
        const imgContent = isUrl
          ? `<img src="${item.imagen}" alt="${item.nombre}" loading="lazy">`
          : `<span>${item.imagen || '🍽️'}</span>`;

        return `
        <div class="product-card" style="animation-delay: ${idx * 0.06}s;">
          <div style="display: flex; gap: 14px; padding: 14px; border: 1px solid rgba(212,175,55,0.1); border-radius: 12px; background: rgba(255,255,255,0.015);">
            <div class="product-img">${imgContent}</div>
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
                <h4 style="font-size: 14px; color: #f5f0e6; margin: 0; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3;">${item.nombre}</h4>
                <span style="font-size: 15px; color: #d4af37; font-weight: 600; white-space: nowrap; font-family: 'Inter', sans-serif;">${item.precio > 0 ? '$' + item.precio : 'Consultar'}</span>
              </div>
              ${item.descripcion ? `<p style="font-size: 12px; color: rgba(245,240,230,0.5); margin: 6px 0 0; line-height: 1.45;">${item.descripcion}</p>` : ''}
              <div style="margin-top: 10px;">
                <span class="badge ${item.disponible ? 'available' : 'unavailable'}">
                  <span class="badge-dot"></span>
                  ${item.disponible ? 'Disponible' : 'No Disponible'}
                </span>
              </div>
            </div>
          </div>
        </div>
      `;}).join('');
    }

    showScreen('screen-products');
  }

  function toggleShowAvailableOnly() {
    showAvailableOnly = !showAvailableOnly;
    const indicator = document.getElementById('avail-toggle-indicator');
    indicator.style.background = showAvailableOnly ? '#f87171' : '#4ade80';
    indicator.style.boxShadow = showAvailableOnly ? '0 0 8px rgba(248,113,113,0.4)' : '0 0 8px rgba(74,222,128,0.4)';

    if (currentCategory && document.getElementById('screen-products').classList.contains('active')) {
      showCategory(currentCategory);
    }
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ═══════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════
  loadMenu();
</script>
</body>
</html>
